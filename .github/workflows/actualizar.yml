name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2

      - name: Sincronizar y formatear datos para el Sheet
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node -e '
          const fetch = require("node-fetch");

          async function procesarPlanilla() {
            const token = process.env.SUPERCELL_TOKEN;
            const sheetId = process.env.SHEET_ID;
            const clanTag = "%232CG8JCYCP";
            
            const headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            };

            console.log("Conectando con Supercell...");
            
            // Consultas simultáneas para las pestañas
            const [resClan, resMiembros, resWar] = await Promise.all([
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag, { headers }),
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/members", { headers }),
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/currentwar", { headers })
            ]);

            const clan = await resClan.json();
            const miembros = await resMiembros.json();
            const guerra = await resWar.json();

            if (resClan.status === 200 && resMiembros.status === 200) {
              console.log("--- DATOS LISTOS PARA LAS 3 PESTAÑAS ---");
              console.log("1. Info del clan (" + clan.name + "): Nivel " + clan.clanLevel + ", Puntos " + clan.clanPoints);
              console.log("2. Miembros: " + miembros.items.length + " jugadores listados para la pestaña Miembros.");
              if (resWar.status === 200) {
                console.log("3. Historial de Guerra Actual Estado: " + guerra.state);
              } else {
                console.log("3. Historial de Guerra Actual: Oculto o Sin guerra activa.");
              }
              console.log("¡Estructura preparada con éxito para tu Google Sheet!");
            } else {
              console.log("Error al procesar los datos de Supercell.");
            }
          }

          procesarPlanilla();
          '
