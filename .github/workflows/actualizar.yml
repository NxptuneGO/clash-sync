name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2 google-spreadsheet@4.1.4 google-auth-library@9.6.3

      - name: Sincronizar con Google Sheets
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node -e '
          const { GoogleSpreadsheet } = require("google-spreadsheet");
          const { JWT } = require("google-auth-library");
          const fetch = require("node-fetch");

          async function actualizarPlanilla() {
            console.log("Iniciando sincronización con Google Sheets...");
            const token = process.env.SUPERCELL_TOKEN;
            const sheetId = process.env.SHEET_ID;
            const clanTag = "%232CG8JCYCP";
            
            const headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            };

            const resMiembros = await fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/members", { headers });
            const dataMiembros = await resMiembros.json();

            if (resMiembros.status === 200) {
              console.log("Datos de Supercell obtenidos con éxito. Total miembros:", dataMiembros.items.length);
              console.log("¡Proceso listo para volcar en las pestañas Miembros, Historial De Guerra Actual e Info del clan!");
            } else {
              console.log("Error al obtener datos:", JSON.stringify(dataMiembros));
            }
          }
          actualizarPlanilla();
          '
