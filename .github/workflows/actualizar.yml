name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2

      - name: Ejecutar sincronización
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_WEB_APP_URL: ${{ secrets.SHEET_WEB_APP_URL }}
        run: node sincronizar.js
