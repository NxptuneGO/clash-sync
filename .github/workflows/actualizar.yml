name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias esenciales
        run: npm install node-fetch@2

      - name: Sincronizar datos de Kyzen Team
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node -e '
          const fetch = require("node-fetch");

          async function sincronizarClan() {
            const token = process.env.SUPERCELL_TOKEN;
            const clanTag = "%232CG8JCYCP";
            
            const headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            };

            console.log("Conectando con Supercell para Kyzen Team...");
            const res = await fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/members", { headers });
            const data = await res.json();
            
            if (res.status === 200) {
              console.log("¡Conexión y lectura exitosa!");
              console.log("Total de miembros obtenidos:", data.items.length);
            } else {
              console.log("Error en la respuesta:", JSON.stringify(data));
            }
          }
          sincronizarClan();
          '
