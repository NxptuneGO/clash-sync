name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2

      - name: Enviar datos a Google Sheets
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_WEB_APP_URL: ${{ secrets.SHEET_WEB_APP_URL }}
        run: |
          node -e '
          const fetch = require("node-fetch");

          async function sincronizarTodo() {
            const token = process.env.SUPERCELL_TOKEN;
            const webhookUrl = process.env.SHEET_WEB_APP_URL;
            const clanTag = "%232CG8JCYCP";
            
            const headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            };

            const [resClan, resMiembros, resWar] = await Promise.all([
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag, { headers }),
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/members", { headers }),
              fetch("https://api.clashofclans.com/v1/clans/" + clanTag + "/currentwar", { headers })
            ]);

            const clanData = await resClan.json();
            const miembrosData = await resMiembros.json();
            const warData = await resWar.json();

            const payload = {
              clanInfo: resClan.status === 200 ? { name: clanData.name, clanLevel: clanData.clanLevel, clanPoints: clanData.clanPoints } : null,
              members: resMiembros.status === 200 ? miembrosData.items.map(m => ({ name: m.name, role: m.role, donations: m.donations, trophies: m.trophies })) : [],
              warInfo: resWar.status === 200 ? { state: warData.state, opponent: warData.opponent ? warData.opponent.name : "N/A", clanStars: warData.clan ? warData.clan.stars : 0, oppStars: warData.opponent ? warData.opponent.stars : 0 } : { state: "No en guerra" }
            };

            const resSheet = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            console.log("Resultado del envío a Google Sheets:", await resSheet.text());
          }
          sincronizarTodo();
          '
