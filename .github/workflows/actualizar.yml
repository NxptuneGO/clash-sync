name: Sincronizar Clash of Clans con Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install node-fetch@2

      - name: Sincronizar datos y planilla
        env:
          SUPERCELL_TOKEN: ${{ secrets.SUPERCELL_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          node -e '
          const fetch = require("node-fetch");
          async function syncAll() {
            const token = process.env.SUPERCELL_TOKEN;
            const sheetId = process.env.SHEET_ID;
            const clanTag = "%232CG8JCYCP";
            
            const headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json"
            };

            console.log("Obteniendo información del clan Kyzen Team...");
            const res = await fetch("https://api.clashofclans.com/v1/clans/" + clanTag, { headers });
            const data = await res.json();
            
            if (res.status === 200) {
              console.log("¡Conexión y lectura exitosa!");
              console.log("Nombre del clan:", data.name);
              console.log("Nivel del clan:", data.clanLevel);
              console.log("Total de miembros:", data.members);
            } else {
              console.log("Error al conectar:", JSON.stringify(data));
            }
          }
          syncAll();
          '
